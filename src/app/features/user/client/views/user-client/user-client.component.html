

<div class="card">


    <p class="font-semibold text-lg">Perfil</p>

    <ng-container *ngIf="userService.user$ | async as user; else loading">
        <div class="my-4">

            <img class="my-4 md:my-0 w-9 md:w-10rem shadow-1 mr-5" src="{{api}}/files/getFile/users/{{user?.image}}" style="max-width: 200px; max-height: 300px; border-radius: 50%;" />
        </div>
    
        <div class="flex justify-content-between flex-wrap">
            <div class="flex align-items-center justify-content-center h-4rem ">
                <div class="flex flex-column">
                    <span class="text-4xl font-bold mb-2">{{ user?.names }} {{ user?.surnames }}</span>
                    <span class="font-semibold">

                        {{ user?.profile === 'TEACHER' ? 'Docente': user?.profile === 'STUDENT' ? 'Estudiante': 'Administrador'  }}
                    </span>
                    <span class="font-medium">{{ user?.email }} </span>
    
                </div>
            </div>
            
            <div class="flex align-items-center justify-content-end h-4rem ">
                <p-button label="Editar información" icon="pi pi-pen-to-square" (click)="onClickUserDetail()" [link]="true" />     
            </div>
        </div>
    </ng-container>
    <ng-template #loading>
        <div class="text-center font-bold">
            Cargando...
        </div>
    </ng-template>


   

</div>
